name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Commit the debug APK to this branch for web distribution'
        type: boolean
        default: false
  push:
    paths-ignore:
      - 'public/releases/**'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use hosted runner Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --licenses > /dev/null
            set -o pipefail
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - name: Prepare APK and SHA-256
        run: |
          mkdir -p public/releases
          cp android/app/build/outputs/apk/debug/app-debug.apk public/releases/mechasonic-release.apk
          sha256sum public/releases/mechasonic-release.apk > public/releases/mechasonic-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MechaSonic-Android-debug
          path: public/releases/
      - name: Bundle into the triggering branch
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')) || (github.event_name == 'workflow_dispatch' && inputs.bundle)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/releases/
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle Android debug APK [skip ci]'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
